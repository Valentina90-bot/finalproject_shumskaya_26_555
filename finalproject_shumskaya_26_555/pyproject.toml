[project]
name = "finalproject-shumskaya-26-555"
version = "0.1.0"
description = "Платформа для отслеживания и симуляции торговли валютами"
readme = "README.md"
authors = [
    { name = "Valentina Shumskaya", email = "salesmanager.deal.2025@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "prettytable>=3.18.0",
    "requests>=2.31.0",
]

[project.scripts]
valutatrade-hub = "valutatrade_hub.main:main"
update-rates = "valutatrade_hub.cli.interface:run_cli"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.1",
]

[tool.uv.sources]
valutatrade_hub = { workspace = true }
